{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Agrave+Pro:wght@100..700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Exotics Pets{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
        <a href="{% url 'blog:index' %}" class="btn">🐍 Exotics Pets</a>
        |
        <a href="{% url 'blog:post_list' %}" class="btn">Artigos 🦦</a>
        |
      {% if user.is_authenticated %}
        <a href="{% url 'blog:post_create' %}" class="btn">+ Novo artigo 🐊</a>
        |
      {% endif %}
        <a href="/admin/" class="btn">Admin 🦌</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>🐉 Exotics Pets Blog 🐉 • 🦉 Made by ThePinkThing 🦉</p>
  </footer>
</body>
</html>
