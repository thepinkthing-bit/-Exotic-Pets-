{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Exotics Pets{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
        <a href="{% url 'blog:index' %}" class="brand">🐍 Exotics Pets</a>
        |
        <a href="{% url 'blog:post_list' %}">Artigos 🦦</a>
        |
      {% if user.is_authenticated %}
        <a href="{% url 'blog:post_create' %}">+ Novo artigo 🐊</a>
        |
      {% endif %}
        <a href="/admin/">Admin 🦌</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>Exotics Pets Blog • Projeto Django</p>
  </footer>
</body>
</html>
