{% extends "base.html" %}
{% load static %}

{% block title %}Início | Exotics Pets{% endblock %}

{% block content %}
  <section class="hero-card">
    <h1>🐉 Bem-vindo ao Exotics Pets! 🐉</h1>
    <p>Um blog para você conhecer esses animalzinhos, caso queiras criar :3.</p>
    <footer>
      🐉 Exotics Pets Blog 🐉 · 🦉 Made by ThePink Thing 🦉
    </footer>
  </section>

  <section class="gif-showcase" aria-label="Destaques animados">
    <div class="gif-card">
      <img src="{% static 'gif1.gif.gif' %}" alt="Animação de pet exótico 1" class="gif-img">
    </div>
    <div class="gif-card">
      <img src="{% static 'gif2.gif.gif' %}" alt="Animação de pet exótico 2" class="gif-img">
    </div>
  </section>
{% endblock %}
